<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت سفارش‌ها</title>
<style>
:root{--bg:#0b1020;--card:#141b30;--line:#26304d;--tx:#e8ecf8;--mu:#93a0c4;--ac:#3ed9c4;--bad:#ff6b6b;--ok:#4ade80;--warn:#fbbf24}
@media (prefers-color-scheme:light){:root:not([data-force]){--bg:#f4f6fb;--card:#fff;--line:#dde3f0;--tx:#16203a;--mu:#5a6788;--ac:#0e9f8e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.8 Tahoma,Vazirmatn,system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea{width:100%;background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px}
button.pri{background:var(--ac);color:#04201c;border-color:transparent;font-weight:700}
button.bad{border-color:var(--bad);color:var(--bad)}button.ok{border-color:var(--ok);color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
.tabs button.on{background:var(--ac);color:#04201c;border-color:transparent}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.s-pending_review{color:var(--warn)}.s-confirmed{color:var(--ac)}.s-delivered{color:var(--ok)}.s-rejected{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 16px;margin:8px 0;color:var(--mu);font-size:13px}.grid b{color:var(--tx)}
.mono{direction:ltr;unicode-bidi:plaintext;font-family:ui-monospace,monospace}
.rc img{max-width:100%;max-height:360px;border-radius:10px;border:1px solid var(--line)}
.msg{font-size:13px;margin:6px 0;color:var(--mu)}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
[hidden]{display:none!important}
</style></head>
<body><div class="wrap">
<div id="login" class="card" style="max-width:380px;margin:60px auto">
  <h1>ورود مدیر</h1>
  <p><input id="em" type="email" placeholder="ایمیل" autocomplete="username" dir="ltr"></p>
  <p><input id="pw" type="password" placeholder="رمز عبور" autocomplete="current-password" dir="ltr"></p>
  <button class="pri" id="btnLogin" style="width:100%">ورود</button>
  <div class="msg bad" id="loginErr" hidden></div>
</div>
<div id="app" hidden>
  <div class="row" style="justify-content:space-between"><h1>سفارش‌ها</h1><div class="row"><button id="btnRef">↻ بروزرسانی</button><button id="btnOut">خروج</button></div></div>
  <div class="row tabs" id="tabs" style="margin-bottom:10px"></div>
  <input id="q" placeholder="جستجو: شماره سفارش، تلفن، نام، تلگرام" style="margin-bottom:12px">
  <div id="list"></div>
</div>
</div>
<script>
var SB_URL='https://ylsxmwivezptnngtqjju.supabase.co', SB_KEY='sb_publishable_gbZbTBe5uuffWZrViG0CfQ_g2evtH0U';
var LABELS={pending_review:'در انتظار بررسی',confirmed:'تأیید پرداخت',delivered:'تحویل شد',rejected:'رد شد'};
var S=null, orders=[], tab='pending_review';
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function load(){ try{ S=JSON.parse(localStorage.getItem('adm_sess')||'null'); }catch(e){ S=null; } }
function save(){ try{ if(S) localStorage.setItem('adm_sess',JSON.stringify(S)); else localStorage.removeItem('adm_sess'); }catch(e){} }
async function auth(body,grant){
  var r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  var j=await r.json(); if(!r.ok||!j.access_token) throw new Error(j.error_description||j.msg||'login');
  S={token:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000}; save();
}
async function ensure(){ if(!S) throw new Error('nosess'); if(Date.now()>S.exp){ await auth({refresh_token:S.refresh},'refresh_token'); } }
async function api(path,opt){
  await ensure(); opt=opt||{}; opt.headers=Object.assign({apikey:SB_KEY,Authorization:'Bearer '+S.token},opt.headers||{});
  var r=await fetch(SB_URL+path,opt); if(r.status===401){ S=null; save(); show(); throw new Error('expired'); } return r;
}
async function fetchOrders(){
  var r=await api('/rest/v1/orders?select=*&order=created_at.desc&limit=300'); if(!r.ok) throw new Error('load');
  orders=await r.json(); render();
}
function show(){ $('login').hidden=!!S; $('app').hidden=!S; }
function renderTabs(){
  var keys=['pending_review','confirmed','delivered','rejected','all'];
  $('tabs').innerHTML=keys.map(function(k){ var n=k==='all'?orders.length:orders.filter(function(o){return o.status===k;}).length;
    return '<button data-t="'+k+'" class="'+(tab===k?'on':'')+'">'+(k==='all'?'همه':LABELS[k])+' ('+n+')</button>'; }).join('');
}
function render(){
  renderTabs(); var q=$('q').value.trim().toLowerCase();
  var list=orders.filter(function(o){ if(tab!=='all'&&o.status!==tab) return false;
    return !q||[o.order_no,o.phone,o.customer_name,o.customer_tg].join(' ').toLowerCase().indexOf(q)>=0; });
  $('list').innerHTML=list.length?list.map(card).join(''):'<div class="card msg">سفارشی در این بخش نیست.</div>';
}
function fa(n){return Number(n).toLocaleString('fa-IR');}
function card(o){
  var tgl=o.customer_tg?'https://t.me/'+String(o.customer_tg).replace(/^@/,''):'';
  return '<div class="card" data-id="'+esc(o.id)+'">'+
   '<div class="row" style="justify-content:space-between"><b class="mono">'+esc(o.order_no)+'</b><span class="badge s-'+esc(o.status)+'">'+esc(LABELS[o.status]||o.status)+'</span></div>'+
   '<div class="grid"><div>سرویس: <b>'+esc(o.service_name)+' — '+esc(o.plan_label)+'</b></div><div>لوکیشن: <b>'+esc(o.location||'—')+'</b></div>'+
   '<div>مبلغ: <b>'+fa(o.price)+' تومان</b></div><div>اعتبار: <b>'+esc(o.validity||'')+'</b></div>'+
   '<div>نام: <b>'+esc(o.customer_name||'—')+'</b></div><div>تلفن: <b class="mono">'+esc(o.phone)+'</b></div>'+
   '<div>تلگرام: <b>'+(tgl?'<a href="'+esc(tgl)+'" target="_blank" rel="noopener">'+esc(o.customer_tg)+'</a>':'—')+'</b></div>'+
   '<div>کارت مبدأ: <b class="mono">'+esc(o.payer_card||'')+'</b></div>'+
   '<div>زمان: <b>'+esc(new Date(o.created_at).toLocaleString('fa-IR'))+'</b></div></div>'+
   (o.notes?'<div class="msg">توضیح مشتری: '+esc(o.notes)+'</div>':'')+
   '<div class="row"><button data-a="rc">🖼 نمایش رسید</button></div><div class="rc"></div>'+
   '<p style="margin:10px 0 4px">لینک سابسکریپشن / کانفیگ برای مشتری:</p>'+
   '<textarea data-f="delivery" rows="2" dir="ltr" placeholder="https://...">'+esc(o.delivery||'')+'</textarea>'+
   '<p style="margin:8px 0 4px">یادداشت داخلی (مشتری نمی‌بیند):</p><input data-f="admin_note" value="'+esc(o.admin_note||'')+'">'+
   '<div class="row" style="margin-top:10px"><button class="ok" data-a="confirmed">✔ تأیید پرداخت</button>'+
   '<button class="pri" data-a="delivered">📦 ذخیره لینک و تحویل</button>'+
   '<button class="bad" data-a="rejected">✖ رد پرداخت</button><button data-a="copy">📋 کپی پیام تحویل</button></div>'+
   '<div class="msg" data-m></div></div>';
}
async function act(el,a){
  var c=el.closest('.card'), id=c.getAttribute('data-id'), o=orders.find(function(x){return x.id===id;}), m=c.querySelector('[data-m]');
  function say(t,k){ m.textContent=t; m.className='msg '+(k||''); }
  var delivery=c.querySelector('[data-f=delivery]').value.trim(), note=c.querySelector('[data-f=admin_note]').value.trim();
  try{
    if(a==='rc'){
      var box=c.querySelector('.rc'); say('در حال دریافت رسید…');
      var r=await api('/storage/v1/object/authenticated/receipts/'+encodeURIComponent(o.receipt_path)); if(!r.ok) throw new Error('rc');
      var b=await r.blob(), u=URL.createObjectURL(b);
      box.innerHTML=(b.type==='application/pdf'?'<a href="'+u+'" target="_blank">باز کردن PDF رسید</a>':'<a href="'+u+'" target="_blank"><img alt="رسید" src="'+u+'"></a>'); say(''); return;
    }
    if(a==='copy'){
      var msg='سلام'+(o.customer_name?' '+o.customer_name:'')+'\nسفارش '+o.order_no+' ('+o.service_name+' — '+o.plan_label+(o.location?' — '+o.location:'')+') آماده شد ✅\n\nلینک سرویس شما:\n'+(delivery||o.delivery||'—');
      await navigator.clipboard.writeText(msg); say('پیام کپی شد.','ok'); return;
    }
    var patch={admin_note:note||null};
    if(a==='confirmed'){ patch.status='confirmed'; }
    if(a==='rejected'){ if(!confirm('پرداخت این سفارش رد شود؟')) return; patch.status='rejected'; }
    if(a==='delivered'){ if(!delivery){ say('ابتدا لینک سرویس را وارد کنید.','bad'); return; } patch.status='delivered'; patch.delivery=delivery; }
    say('در حال ذخیره…');
    var r2=await api('/rest/v1/orders?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(patch)});
    if(!r2.ok) throw new Error('save'); var j=await r2.json(); if(!j.length) throw new Error('noperm');
    Object.assign(o,j[0]); render();
  }catch(e){ say('انجام نشد ('+(e.message||'error')+'). دوباره تلاش کنید.','bad'); }
}
$('btnLogin').onclick=async function(){
  var err=$('loginErr'); err.hidden=true;
  try{ await auth({email:$('em').value.trim(),password:$('pw').value},'password'); $('pw').value=''; show(); await fetchOrders(); }
  catch(e){ err.textContent='ورود ناموفق بود؛ ایمیل و رمز را بررسی کنید.'; err.hidden=false; }
};
$('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') $('btnLogin').click(); });
$('btnOut').onclick=function(){ S=null; save(); orders=[]; show(); };
$('btnRef').onclick=function(){ fetchOrders().catch(function(){}); };
$('q').oninput=render;
$('tabs').onclick=function(e){ var b=e.target.closest('[data-t]'); if(b){ tab=b.getAttribute('data-t'); render(); } };
$('list').onclick=function(e){ var b=e.target.closest('[data-a]'); if(b) act(b,b.getAttribute('data-a')); };
load(); show(); if(S) fetchOrders().catch(function(){});
</script></body></html>
